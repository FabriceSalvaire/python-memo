[project]
name = "python-memo"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orjson>=3.11.7",
    "rich>=14.3.3",
]


[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "pyright>=1.1.408",
    "pyterate",
    "rassumfrassum>=0.3.3",
    "ruff>=0.15.2",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-sitemap>=2.9.0",
    "sphinxcontrib-getthecode>=1.3.0",
    "ty>=0.0.18",
]

####################################################################################################

[tool.uv.sources]
pyterate = { git = "https://github.com/FabriceSalvaire/Pyterate" }
sphinxcontrib-getthecode = { git = "https://github.com/FabriceSalvaire/sphinx-getthecode" }

####################################################################################################

# or ty.toml
[tool.ty.rules]
# index-out-of-bounds = "ignore"


[tool.ruff]
# Exclude a variety of commonly ignored directories
# exclude = [...]

line-length = 100
indent-width = 4

target-version = "py314"


[tool.ruff.lint]
preview = true

# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# select = ["E4", "E7", "E9", "F"]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = [
  "E302", # blank-lines-top-level
  "E305", # blank-lines-after-function-or-class
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
# dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.format]
quote-style = "preserve"   # else single | double
indent-style = "space"
# skip-magic-trailing-comma = false
# line-ending = "auto"

# reStructuredText code/literal blocks and doctests are all supported.
# This is currently disabled by default, but it is planned for this to be opt-out in the future.
# docstring-code-format = false
# 
# Set the line length limit used when formatting code snippets in docstrings.
# This only has an effect when the `docstring-code-format` setting is enabled.
# docstring-code-line-length = "dynamic"
